<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | MCSK Library ✨</title>
    <meta name="theme-color" content="#1e3c72">
    <link rel="stylesheet" href="style.css">
    
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    
    <div class="theme-switch-wrapper header-actions">
        <button class="lang-btn" onclick="toggleLanguage()">TH</button>
        <button id="theme-toggle" class="theme-btn">🌙</button>
    </div>

    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>

    <div class="container">
        <div id="login-form" class="form-box active-form">
            <h2>เข้าสู่ระบบ</h2>
            <form id="log-form">
                <div class="input-group">
                    <label>รหัสพนักงาน หรือ อีเมล</label>
                    <input type="text" id="login-email" required placeholder="เช่น MOCAP9946">
                </div>
                <div class="input-group">
                    <label>รหัสผ่าน</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" required placeholder="********">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('login-password')">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn" id="login-btn">เข้าสู่ระบบ</button>
                <p class="switch-text">ยังไม่มีบัญชี? <a href="#" onclick="toggleForm('register')">สมัครสมาชิกที่นี่</a></p>
            </form>
        </div>

        <div id="register-form" class="form-box">
            <h2>สมัครสมาชิก</h2>
            <form id="reg-form">
                <div class="input-group">
                    <label>ชื่อ-นามสกุล</label>
                    <input type="text" id="reg-name" name="name" required placeholder="ชื่อของคุณ">
                </div>
                <div class="input-group">
                    <label>อีเมล</label>
                    <input type="email" id="reg-email" name="email" required placeholder="example@mail.com">
                </div>
                <div class="input-group">
                    <label>รหัสผ่าน</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" name="password" required placeholder="********">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('reg-password')">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn" id="submit-btn">สมัครสมาชิก</button>
                <p class="switch-text">มีบัญชีอยู่แล้ว? <a href="#" onclick="toggleForm('login')">เข้าสู่ระบบที่นี่</a></p>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
